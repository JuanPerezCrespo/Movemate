<div th:fragment="sidebar">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 200px;
            height: 100vh;
            background-color: #2c3e50;
            padding: 20px;
            box-sizing: border-box;
            color: white;
        }

        .sidebar h2 {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #ecf0f1;
        }

        .sidebar a {
            display: block;
            color: #ecf0f1;
            text-decoration: none;
            margin: 10px 0;
            padding: 5px;
        }

        .sidebar a:hover {
            background-color: #34495e;
        }

        .content {
            margin-left: 220px;
            padding: 20px;
        }
    </style>

    <div class="sidebar">
        <h2>🏃 Movemate</h2>
        <a th:href="@{/}">🏠 Inicio</a>
        <a th:href="@{/actividades}">📅 Actividades</a>
        <a th:href="@{/logout}">🔓 Logout</a>
    </div>
</div>
