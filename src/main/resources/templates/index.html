<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Inicio - Movemate</title>
</head>
<body>
    <div th:replace="fragments/sidebar :: sidebar"></div>
    <h1>Bienvenido a Movemate</h1>

    <div sec:authorize="isAuthenticated()">
        <p>Hola, <strong><span sec:authentication="name"></span></strong></p>

        <div sec:authorize="hasRole('MONITOR')">
            <a th:href="@{/actividades/nueva}">Crear nueva actividad</a>
        </div>

        <div sec:authorize="hasRole('CLIENTE')">
            <a th:href="@{/actividades}">Ver y reservar actividades</a>
        </div>

        <a th:href="@{/logout}">Cerrar sesión</a>
    </div>

    <div sec:authorize="isAnonymous()">
        <p>No has iniciado sesión</p>
        <a th:href="@{/login}">Iniciar sesión</a>
    </div>
</body>
</html>
