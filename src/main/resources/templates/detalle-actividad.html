<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Detalle de Actividad</title>
    <style>
        .content {
            margin-left: 220px;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        h1, h3 {
            color: #2c3e50;
        }

        ul {
            list-style: disc;
            padding-left: 20px;
        }

        p {
            margin: 10px 0;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #2980b9;
        }

        button {
            margin-top: 15px;
            padding: 8px 16px;
            background-color: #27ae60;
            border: none;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #2ecc71;
        }
    </style>
</head>
<body>
    <div th:replace="fragments/sidebar :: sidebar"></div>

    <div class="content">
        <h1>Detalle de la Actividad</h1>

        <p><strong>Deporte:</strong> <span th:text="${actividad.deporte}"></span></p>
        <p><strong>Ubicación:</strong> <span th:text="${actividad.ubicacion}"></span></p>
        <p><strong>Fecha y hora:</strong> <span th:text="${actividad.fecha}"></span></p>
        <p><strong>Precio:</strong> <span th:text="${actividad.precio}"></span> €</p>
        <p><strong>Participantes:</strong> <span th:text="${actividad.participantes}"></span></p>
        <p><strong>Descripción:</strong> <span th:text="${actividad.descripcion}"></span></p>
        <p><strong>Monitor:</strong> <span th:text="${actividad.monitor?.nombre ?: 'No asignado'}"></span></p>
        <p><strong>Estado:</strong> <span th:text="${actividad.estado}"></span></p>

        <div th:if="${actividad.reservas}">
            <h3>Participantes inscritos:</h3>
            <ul>
                <li th:each="reserva : ${actividad.reservas}"
                    th:text="${reserva.usuario?.nombre ?: 'Usuario sin nombre'}"></li>
            </ul>
        </div>

        <div sec:authorize="hasRole('CLIENTE')">
            <form th:action="@{/actividades/reservar}" method="post">
                <input type="hidden" name="actividadId" th:value="${actividad.id}" />
                <button type="submit">Apuntarme</button>
            </form>
        
            <!-- Mostrar botón de desapuntarse solo si el usuario ya está inscrito -->
            <form th:action="@{/actividades/desapuntarse}" method="post"
                  th:if="${actividad.reservas.?[usuario.username == #authentication.name].size() > 0}">
                <input type="hidden" name="actividadId" th:value="${actividad.id}" />
                <button type="submit" style="background-color: #e74c3c;">❌ Desapuntarse</button>
            </form>
        </div>

        <a th:href="@{/actividades}">⬅ Volver al listado</a>
    </div>
</body>
</html>
