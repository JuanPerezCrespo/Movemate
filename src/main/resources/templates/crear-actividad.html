<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Crear nueva actividad</title>
</head>
<body>
    <div th:replace="fragments/sidebar :: sidebar"></div>
    <h1>Crear nueva actividad</h1>
    <label>Monitor asignado:</label>
    <input type="text" th:value="${#authentication.name}" readonly /><br/>


    <form th:action="@{/actividades/guardar}" th:object="${actividad}" method="post">
        <label>Deporte:</label>
        <input type="text" th:field="*{deporte}" /><br/>

        <label>Ubicación:</label>
        <input type="text" th:field="*{ubicacion}" /><br/>

        <label>Fecha y hora:</label>
        <input type="datetime-local" th:field="*{fecha}" /><br/>

        <label>Precio:</label>
        <input type="number" step="0.01" th:field="*{precio}" /><br/>

        <label>Participantes:</label>
        <input type="number" th:field="*{participantes}" /><br/>

        <label>Descripción:</label><br/>
        <textarea th:field="*{descripcion}"></textarea><br/>

        <button type="submit">Guardar actividad</button>
    </form>

    <a href="/actividades">Volver a la lista</a>
</body>
</html>
