<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión - Movemate</title>
    <style>
        /* Estilo general */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9; /* Fondo claro */
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); /* Sombra elegante */
            width: 100%;
            max-width: 400px; /* Ancho máximo */
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #1e3a8a; /* Azul oscuro */
            font-size: 24px;
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        input[type="text"],
        input[type="password"] {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            width: 100%;
            margin-bottom: 15px;
            font-size: 14px;
            box-sizing: border-box;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #1e3a8a; /* Azul oscuro */
            outline: none;
            box-shadow: 0 0 5px rgba(30, 58, 138, 0.3); /* Sombra al enfocar */
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #1e3a8a; /* Azul oscuro */
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #2c5282; /* Azul más claro */
        }

        .register-link {
            margin-top: 20px;
            font-size: 14px;
        }

        .register-link a {
            color: #1e3a8a; /* Azul oscuro */
            text-decoration: none;
            font-weight: bold;
        }

        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="login-container">
    <h2>🔐 Iniciar sesión</h2>
    <form th:action="@{/login}" method="post">
        <label for="username">Usuario:</label>
        <input type="text" id="username" name="username" placeholder="Introduce tu usuario" required />

        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" placeholder="Introduce tu contraseña" required />

        <button type="submit">Entrar</button>
    </form>

    <!-- Enlace a registro -->
    <div class="register-link">
        <p>¿No tienes cuenta? <a th:href="@{/registro}">Regístrate aquí</a></p>
    </div>
</div>
</body>
</html>
