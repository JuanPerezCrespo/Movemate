<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Mis Actividades</title>
    <link rel="stylesheet" href="/Stylesheets/cssMisactividades.css">
</head>

<body>
    <div th:replace="fragments/sidebar :: sidebar"></div>

    <div class="content">
        <h1>📋 Mis Actividades</h1>
        <div th:if="${tipo == 'cliente'}">
            <div id="contenido-cliente">
                <div class="user-info">
                    <h2>Mis datos personales</h2>
                    <ul>
                        <li>
                            <p><strong>Nombre:</strong> <span th:text="${usuario.nombre}"></span></p>

                        </li>
                        <li>
                            <p><strong>Email:</strong> <span th:text="${usuario.email}"></span></p>

                        </li>
                        <li>
                            <p><strong>Teléfono:</strong> <span th:text="${usuario.telefono}"></span></p>
                        </li>
                        <li>
                            <p><strong>Género:</strong> <span th:text="${usuario.genero}"></span></p>
                        </li>
                        <li>
                            <p><strong>Dirección:</strong> <span th:text="${usuario.direccion}"></span></p>
                        </li>
                    </ul>
                    <form action="/usuario/eliminar" method="post"
                        onsubmit="return confirm('¿Estás seguro de que deseas eliminar tu cuenta? Esta acción no se puede deshacer.')">
                        <button type="submit" class="btn btn-danger">Eliminar cuenta</button>
                    </form>
                </div>
                <div class="user-activities">
                    <h2>Actividades reservadas</h2>
                    <div th:each="reserva : ${reservas}" class="actividad">
                        <img th:src="@{${reserva.actividad.imagenUrl}}" alt="Imagen de la actividad"
                            class="card-img-top" onerror="this.src='/images/default.jpg'">
                        <p><strong>Deporte:</strong> <span th:text="${reserva.actividad.deporte}"></span></p>
                        <ul>
                            <li>
                                <p><strong>Fecha:</strong> <span th:text="${#temporals.format(reserva.actividad.fecha, 'dd/MM/yyyy HH:mm')}"></span></p>
                            </li>
                            <li>
                                <p><strong>Ubicación:</strong> <span th:text="${reserva.actividad.ubicacion}"></span>
                                </p>
                            </li>
                            <li>
                                <strong> <a th:href="@{'/actividades/' + ${reserva.actividad.id}}">Ver detalle de la
                                        actividad</a></strong>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${tipo == 'monitor'}">
            <h2>Actividades creadas</h2>
            <ul>
                <li th:each="actividad : ${actividades}">
                    <span th:text="${actividad.deporte}"></span> -
                    <span th:text="${actividad.fecha}"></span> en
                    <span th:text="${actividad.ubicacion}"></span>
                    (<a th:href="@{'/actividades/' + ${actividad.id}}">Ver detalle</a>)
                </li>
            </ul>
        </div>

        <a th:href="@{/}">⬅ Volver al inicio</a>
    </div>
</body>

</html>
