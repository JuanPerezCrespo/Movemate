<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Actividades</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <style>
        #map { height: 500px; width: 100%; }
    </style>
</head>
<body>

    <h2>Mapa de Actividades</h2>
    <div id="map"></div>

    <script>
        // Crear mapa centrado en una ubicación inicial
        var map = L.map('map').setView([40.4168, -3.7038], 13); // Madrid como ejemplo

        // Agregar capa base de OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Obtener actividades del backend
        fetch('/actividades/ubicaciones')
            .then(response => response.json())
            .then(data => {
                data.forEach(actividad => {
                    L.marker([actividad.latitud, actividad.longitud])
                        .addTo(map)
                        .bindPopup(`<b>${actividad.deporte}</b>`);
                });
            })
            .catch(error => console.error('Error cargando actividades:', error));
    </script>

</body>
</html>
