<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Editar Actividad</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .content {
            margin-left: 240px;
            padding: 30px;
        }

        form input, form textarea {
            width: 100%;
            padding: 8px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            background-color: #1e3a8a;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }

        button:hover {
            background-color: #3b82f6;
        }

        a {
            display: inline-block;
            margin-top: 15px;
            text-decoration: none;
            color: #1e3a8a;
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<!-- Contenido principal -->
<div class="content">
    <h1>Editar Actividad</h1>

    <form th:action="@{'/actividades/' + ${actividad.id} + '/editar'}" th:object="${actividad}" method="post" enctype="multipart/form-data">
        <input type="hidden" name="_method" value="patch" />

        <label>Monitor asignado:</label>
        <input type="text" th:field="*{monitor.nombre}" placeholder="Escribe el nombre del monitor" required /><br/>
        
        <label>Deporte:</label>
        <input type="text" th:field="*{deporte}" />
    
        <label>Ubicación:</label>
        <input type="text" th:field="*{ubicacion}" />

        <label>Dirección:</label>
        <input type="text" th:field="*{direccion}" />
    
        <label>Fecha y hora:</label>
        <input type="datetime-local" th:field="*{fecha}" min="1000-01-01T00:00" max="9999-12-31T23:59" />
    
        <label>Precio:</label>
        <input type="number" step="0.01" th:field="*{precio}" />
    
        <label>Participantes:</label>
        <input type="number" th:field="*{participantes}" readonly />

        <label>Máximo de Participantes:</label>
        <input type="number" th:field="*{maxParticipantes}" min="1" required />
    
        <label>Descripción:</label>
        <textarea th:field="*{descripcion}"></textarea>
    
        <!-- Campo para subir nueva imagen -->
        <label>Imagen:</label>
        <input type="file" name="imagen" accept="image/*" />
    
        <button type="submit">Guardar cambios</button>
    </form>
    
    <a th:href="@{/actividades}">⬅ Volver a la lista</a>
</div>

</body>
</html>
