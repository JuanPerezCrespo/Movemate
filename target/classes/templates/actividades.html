<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Actividades disponibles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .content {
            margin-left: 240px; /* espacio para el sidebar */
            padding: 30px;
        }

        .card-img-top {
            height: 200px;
            object-fit: cover;
        }

        .card h5 {
            font-size: 1.2rem;
        }

        .card p {
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<!-- Contenido -->
<div class="content">
    <h1 class="mb-4">Actividades disponibles</h1>
    <div class="mb-4">
        <a class="btn btn-outline-primary me-2"
           th:href="@{/actividades(mostrar='futuras')}"
           th:classappend="${mostrar} == 'futuras' ? 'active' : ''">
            Próximas Actividades
        </a>
    
        <a class="btn btn-outline-secondary me-2"
           th:href="@{/actividades(mostrar='todas')}"
           th:classappend="${mostrar} == 'todas' or mostrar == null ? 'active' : ''">
            Todas
        </a>
    
        <a class="btn btn-outline-warning"
           th:href="@{/actividades(mostrar='pasadas')}"
           th:classappend="${mostrar} == 'pasadas' ? 'active' : ''">
            Pasadas
        </a>
    </div>
    
    

    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col" th:each="actividad : ${actividades}">
            <div class="card h-100 shadow-sm" th:classappend="${actividad.estado == 'Cancelada'} ? ' bg-light text-muted border-secondary' : ''">
                <img th:src="${actividad.imagenUrl}" class="card-img-top" alt="Imagen de actividad"
     onerror="this.src='/images/default.jpg'" />


                <div class="card-body">
                    <span class="badge bg-secondary mb-2" th:if="${actividad.estado == 'Cancelada'}">Cancelada</span>
                    <h5 class="card-title" th:text="${actividad.deporte}">Deporte</h5>
                    <p><strong>Ubicación:</strong> <span th:text="${actividad.ubicacion}">Ubicación</span></p>
                    <p><strong>Fecha:</strong> <span th:text="${#temporals.format(actividad.fecha, 'dd/MM/yyyy HH:mm')}">Fecha</span></p>
                    <p><strong>Precio:</strong> <span th:text="${actividad.precio}">0</span> €</p>
                    <a class="btn btn-primary mt-2" th:href="@{'/actividades/' + ${actividad.id}}">Más detalles</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
