<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <style>
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 200px;
            height: 100vh;
            background-color: #333;
            color: white;
            padding: 1rem;
        }

        .sidebar h2 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            margin: 10px 0;
            padding: 5px;
        }

        .sidebar a:hover {
            background-color: #444;
        }

        .content {
            margin-left: 220px;
            padding: 1rem;
        }
    </style>
</head>
<body>
<div th:fragment="header">
    <div class="sidebar">
        <h2>🏃 Movemate</h2>
        <a th:href="@{/}">🏠 Inicio</a>
        <a th:href="@{/actividades}">📅 Actividades</a>
        <a th:href="@{/logout}">🔓 Logout</a>
    </div>
</div>
</body>
</html>
