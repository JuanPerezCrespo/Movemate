<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Inicio - Movemate</title>
    <link rel="stylesheet" href="/Stylesheets/cssIndex.css">
</head>
<body>

<!-- Sidebar reutilizable -->
<div th:replace="fragments/sidebar :: sidebar"></div>

<!-- Contenido principal -->
<div id="content">
    <h1>Bienvenido a Movemate</h1>

    <div sec:authorize="isAuthenticated()">
        <p>Hola, <strong><span sec:authentication="name"></span></strong></p>

        <div sec:authorize="hasRole('MONITOR')">
            <a class="botones" th:href="@{/actividades/nueva}">➕ Crear nueva actividad</a>
        </div>

        <div sec:authorize="hasRole('CLIENTE')">
            <a class="botones" th:href="@{/actividades}">📅 Ver y reservar actividades</a>
        </div>
    </div>

    <div sec:authorize="isAnonymous()">
        <p>No has iniciado sesión.</p>
        <a th:href="@{/login}">🔐 Iniciar sesión</a><br/>
        <a th:href="@{/registro}">📝 Registrarse</a>
    </div>
</div>

</body>
</html>
