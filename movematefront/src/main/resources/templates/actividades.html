<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Actividades disponibles</title>
    <link rel="stylesheet" href="/css/cssActividades.css">
    <link rel="icon" href="/Images/logo.png" type="image/png">
    <!-- Leaflet CSS (mapa)-->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

</head>

<body>

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div id="contenido" th:fragment="content">
        <h1>Actividades disponibles</h1>

        <!-- Caja de filtros -->
        <div class="filtros-container">
            <h2>Filtros</h2>
            <div class="filtros-box">
                <form th:action="@{/actividad/actividades}" method="get"
                    style="display: flex; flex-wrap: wrap; gap: 15px;">
                    <!-- Filtro por tipo de actividades -->
                    <div>
                        <label for="mostrar">Fecha:</label>
                        <select id="mostrar" name="mostrar" onchange="this.form.submit()">
                            <option value="todas" th:selected="${mostrar == 'todas' || mostrar == null}">Todas</option>
                            <option value="futuras" th:selected="${mostrar == 'futuras'}">Próximas Actividades</option>
                            <option value="pasadas" th:selected="${mostrar == 'pasadas'}">Actividades Pasadas</option>
                        </select>
                    </div>

                    <!-- Filtro por ubicación -->
                    <div>
                        <label for="ubicacion">Ubicación:</label>
                        <select id="ubicacion" name="ubicacion" onchange="this.form.submit()" >
                            <option value="" th:selected="${ubicacion == null || ubicacion == ''}">Todas las ubicaciones
                            </option>
                            <option value="Madrid" th:selected="${ubicacion == 'Madrid'}">Madrid</option>
                            <option value="Barcelona" th:selected="${ubicacion == 'Barcelona'}">Barcelona</option>
                            <option value="Valencia" th:selected="${ubicacion == 'Valencia'}">Valencia</option>
                            <option value="Sevilla" th:selected="${ubicacion == 'Sevilla'}">Sevilla</option>
                            <option value="Zaragoza" th:selected="${ubicacion == 'Zaragoza'}">Zaragoza</option>
                            <option value="Málaga" th:selected="${ubicacion == 'Málaga'}">Málaga</option>
                        </select>
                    </div>

                    <!-- Filtro por deporte -->
                    <div>
                        <label for="deporte">Tipo de actividad:</label>
                        <select id="deporte" name="deporte" onchange="this.form.submit()">
                            <option value="" th:selected="${deporte == null || deporte == ''}">Todos los deportes
                            </option>
                            <option value="Fútbol" th:selected="${deporte == 'Fútbol'}">Fútbol</option>
                            <option value="Baloncesto" th:selected="${deporte == 'Baloncesto'}">Baloncesto</option>
                            <option value="Tenis" th:selected="${deporte == 'Tenis'}">Tenis</option>
                            <option value="Natación" th:selected="${deporte == 'Natación'}">Natación</option>
                            <option value="Ciclismo" th:selected="${deporte == 'Ciclismo'}">Ciclismo</option>
                            <option value="Running" th:selected="${deporte == 'Running'}">Running</option>
                        </select>
                    </div>

                    <!-- Filtro por nivel -->
                    <div>
                        <label for="nivel">Nivel:</label>
                        <select id="nivel" name="nivel" onchange="this.form.submit()">
                            <option value="" th:selected="${nivel == null || nivel == ''}">Todos los niveles</option>
                            <option value="Principiante" th:selected="${nivel == 'Principiante'}">Principiante</option>
                            <option value="Intermedio" th:selected="${nivel == 'Intermedio'}">Intermedio</option>
                            <option value="Avanzado" th:selected="${nivel == 'Avanzado'}">Avanzado</option>
                        </select>
                    </div>

                    <!-- Filtro por precio mínimo -->
                    <div>
                        <label for="minPrice">Precio mínimo:</label>
                        <input type="number" id="minPrice" name="minPrice" step="0.5" placeholder="0.00"
                            th:value="${minPrice}" />
                    </div>

                    <!-- Filtro por precio máximo -->
                    <div>
                        <label for="maxPrice">Precio máximo:</label>
                        <input type="number" id="maxPrice" name="maxPrice" step="0.5" placeholder="0.00"
                            th:value="${maxPrice}" />
                    </div>

                    <!-- Botón de filtrar -->
                    <div>
                        <button type="submit" class="boton">Filtrar</button>
                    </div>
                </form>

                <!-- Botón para restablecer filtros -->
                <a th:href="@{/actividad/actividades}" class="boton">Restablecer filtros</a>
            </div>
        </div>

        <section id="actividades">
            <div th:each="actividad : ${actividades}" class="actividad">
                <img th:src="${actividad.imagenUrl}" class="imagen-actividad" alt="Imagen de actividad"
                    onerror="this.src='/images/default.jpg'" />
                <div class="card-body">
                    <h5 class="card-title" th:text="${actividad.deporte}">Deporte</h5>
                    <p><strong>Ubicación:</strong> <span th:text="${actividad.ubicacion}">Ubicación</span></p>
                    <p><strong>Fecha:</strong> <span
                            th:text="${#temporals.format(actividad.fecha, 'dd/MM/yyyy HH:mm')}">Fecha</span></p>
                    <p><strong>Precio:</strong> <span th:text="${actividad.precio}">0</span> €</p>
                    <p><strong>Nivel:</strong> <span th:text="${actividad.nivel}">Nivel</span></p>
                    <a class="btn-cancelada" th:href="@{'/actividad/' + ${actividad.id}}"
                        th:if="${actividad.estado == 'Cancelada'}">Cancelada</a>
                    <a class="btn" th:href="@{'/actividad/' + ${actividad.id}}"
                        th:if="${actividad.estado == 'Disponible'}">Más detalles</a>
                    <a class="btn-completada" th:href="@{'/actividad/' + ${actividad.id}}"
                        th:if="${actividad.estado == 'Completa'}">Completa</a>
                </div>
            </div>
        </section>
        <h2>Mapa de actividades:</h2>
        <div id="map"></div>
    </div>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script th:inline="javascript">
        // Inicializar el mapa centrado en España
        var map = L.map('map').setView([40.4168, -3.7038], 6);

        // Capa base de OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 18
        }).addTo(map);

        // Obtener lista de actividades del modelo Thymeleaf
        /*<![CDATA[*/
        let actividades = /*[[${actividades}]]*/[];
        /*]]>*/

        let bounds = [];

        actividades.forEach(act => {
            if (act.latitud && act.longitud) {
                let lat = parseFloat(act.latitud);
                let lon = parseFloat(act.longitud);
                bounds.push([lat, lon]);

                let popupHtml = `
                <strong>${act.deporte}</strong><br>
                <em>${act.ubicacion}</em><br>
                ${act.direccion}<br>
                <strong>Fecha:</strong> ${act.fecha ? act.fecha.replace('T', ' ').substring(0, 16) : ''}<br>
                <strong>Estado:</strong> ${act.estado}<br>
                <a href="/actividad/${act.id}">Ver más</a>
            `;

                L.marker([lat, lon]).addTo(map).bindPopup(popupHtml);
            }
        });

        if (bounds.length > 0) {
            map.fitBounds(bounds, { padding: [50, 50] });
        }
    </script>


</body>

</html>
