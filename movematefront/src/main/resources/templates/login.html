<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org"
    xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity3">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicia sesión</title>
    <link rel="icon" href="/Images/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="/css/login.css">
</head>

<body>
    <div id="login-container">
        <h1>Iniciar sesión</h1>
        <!-- Mostrar mensaje de error si el parámetro "error" está presente -->
        <div th:if="${param.error}" class="error-message">
            <p>Usuario o contraseña incorrectos. Por favor, inténtalo de nuevo.</p>
        </div>
        <form th:action="@{/login}" method="post">
            <label for="username">Usuario:</label>
            <input type="text" id="username" name="username" placeholder="Introduce tu usuario" required />

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" placeholder="Introduce tu contraseña" required />

            <button type="submit">Entrar</button>
        </form>
        <div class="register-link">
            <p>¿No tienes cuenta? <a th:href="@{/registroClientes}">Regístrate aquí</a></p>
        </div>
        <div class="register-link">
            <p>¿Eres un monitor? <a th:href="@{/registroMonitores}">Regístrate aquí</a></p>
        </div>
    </div>
</body>

</html>
