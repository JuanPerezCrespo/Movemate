<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Editar actividad</title>
    <link rel="stylesheet" href="/css/cssCrearActividad.css">
    <link rel="icon" href="/Images/logo.png" type="image/png">
</head>

<body>

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <!-- Contenido principal -->
    <div class="content">
        <h1>Editar actividad</h1>

        <form th:action="@{/actividad/{id}/editar(id=${actividad.id})}" th:object="${actividad}" method="post" enctype="multipart/form-data"
            id="crearActividadForm">
            <label>Tipo de actividad:</label>
            <select th:field="*{deporte}" required>
                <option value="" disabled selected>Selecciona un deporte</option>
                <option value="Fútbol">Fútbol</option>
                <option value="Baloncesto">Baloncesto</option>
                <option value="Tenis">Tenis</option>
                <option value="Natación">Natación</option>
                <option value="Ciclismo">Ciclismo</option>
                <option value="Running">Running</option>
            </select>
            <label>Nivel de la actividad</label>
            <select th:field="*{nivel}" required>
                <option value="" disabled selected>Selecciona un nivel</option>
                <option value="Principiante">Principiante</option>
                <option value="Intermedio">Intermedio</option>
                <option value="Avanzado">Avanzado</option>
            </select>
            <p><label>Ubicación:
                    <select th:field="*{ubicacion}" required>
                        <option value="" disabled selected>Selecciona una ubicación</option>
                        <option value="Madrid">Madrid</option>
                        <option value="Barcelona">Barcelona</option>
                        <option value="Valencia">Valencia</option>
                        <option value="Sevilla">Sevilla</option>
                        <option value="Zaragoza">Zaragoza</option>
                        <option value="Málaga">Málaga</option>
                    </select>
                </label></p>

            <label for="direccion">Dirección:</label>
            <input type="text" th:field="*{direccion}" placeholder="Escribe la dirección de la actividad" required />

            <label>Fecha y hora:</label>
            <input type="datetime-local" th:field="*{fecha}" min="1000-01-01T00:00" max="9999-12-31T23:59" />

            <label>Precio:</label>
            <input type="number" step="0.1" th:field="*{precio}" />

            <label>Máximo de Participantes:</label>
            <input type="number" th:field="*{maxParticipantes}" min="1" required />

            <label>Descripción:</label>
            <textarea th:field="*{descripcion}" placeholder="Escribe una breve descripción de la actividad"></textarea>

            <!-- Nuevo campo para subir imagen -->
            <label>Imagen:</label>
            <input type="file" name="imagen" accept="image/*" />

            <!-- Campo oculto para enviar el ID del usuario -->
            <input type="hidden" name="monitorID" th:value="${usuario.id}" />

            <button type="submit" id="guardarActividad">Guardar actividad</button>

        </form>


        <a th:href="@{/inicio}" id="volver">⬅ Volver al inicio</a>
    </div>

</body>

</html>
